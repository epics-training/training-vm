name: "Run molecule tests"

on:
  push:
    paths:
      - 'ansible/**'
  pull_request:
    paths:
      - 'ansible/**'

jobs:
  molecule:
    name: "${{ matrix.role }} (${{ matrix.arch.name }})"
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
    strategy:
      # Don't let a failure on one architecture hide the result on the other
      fail-fast: false
      matrix:
        role: ["initial_setup", "m_base"]
        # The molecule platform image (ubuntu:22.04) is multi-arch, so each
        # runner exercises the role natively on its own architecture
        arch:
          - name: x86_64
            runner: ubuntu-latest
          - name: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: "${{ github.repository }}"
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.x"
      - name: Install dependencies
        run: |
          pip install "ansible>11,<12" molecule=="25.1.0" molecule-plugins=="23.7.0" molecule-docker pytest pytest-testinfra
      - name: Run molecule tests
        working-directory: "${{ github.repository }}/ansible/roles/${{ matrix.role }}"
        run: |
          molecule test
        env:
          PY_COLORS: 1
