name: "Roles: Phoebus & AA"

on:
  push:
    paths:
      - '.github/workflows/test-roles-phoebus-aa.yml'
      - 'ansible/vars/ci-*.yml'
      - 'ansible/playbook.yml'
      - 'ansible/requirements.yml'
      - 'ansible/roles/phoebus/**'
      - 'ansible/roles/java/**'
      - 'ansible/roles/archiver_appliance/**'
  pull_request:
    paths:
    - '.github/workflows/test-roles-phoebus-aa.yml'
    - 'ansible/vars/ci-*.yml'
    - 'ansible/playbook.yml'
    - 'ansible/requirements.yml'
    - 'ansible/roles/phoebus/**'
    - 'ansible/roles/java/**'
    - 'ansible/roles/archiver_appliance/**'
  workflow_dispatch:
    inputs:
      architectures:
        description: "Architectures to run (aarch64 needs a runner with /dev/kvm)"
        type: choice
        default: x86_64
        options:
          - x86_64
          - aarch64
          - x86_64,aarch64

permissions: {}

jobs:
  check:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_check.yml

  arch:
    needs: check
    uses: ./.github/workflows/_arch_matrix.yml
    with:
      architectures: ${{ inputs.architectures || '' }}

  resolve:
    needs: check
    permissions:
      actions: read
    uses: ./.github/workflows/_resolve_build_run.yml
    with:
      workflow_file: "build-cloud-init-images.yml"
      sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

  test:
    needs: [check, resolve, arch]
    name: "${{ matrix.distro }}/${{ matrix.arch.name }}: ${{ matrix.conf.name }}"
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, rocky, debian, fedora]
        # Resolved by _arch_matrix.yml: x86_64 always, aarch64 only when
        # explicitly dispatched (GitHub's arm64 runners have no /dev/kvm).
        arch: ${{ fromJSON(needs.arch.outputs.matrix) }}
        conf:
          - name: "Phoebus & Archiver"
            id: "ci-phoebus-aa"
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.arch.qemu }}

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          # On a runner without /dev/kvm at all, --name-match=kvm fails with an
          # opaque "Failed to open the device 'kvm'". Report the real problem
          # instead: QEMU would silently fall back to TCG emulation and grind
          # past the job timeout, so stop here with an actionable message.
          sudo udevadm trigger --name-match=kvm || true
          if [ ! -e /dev/kvm ]; then
            echo "::error ::No /dev/kvm on this $(uname -m) runner. These jobs need hardware virtualization - GitHub's arm64 hosted runners do not provide it. Use a KVM-capable (self-hosted or larger) runner."
            exit 1
          fi

      - name: Download qcow2 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: training-vm-${{ matrix.distro }}-${{ matrix.arch.name }}-qcow2
          path: /tmp/qcow2
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Ansible in QEMU (${{ matrix.conf.name }}, source=${{ needs.resolve.outputs.source }})
        run: |
          ./cloud-init/run_ansible_test.sh \
            -i /tmp/qcow2/${{ matrix.distro }}-${{ matrix.arch.name }}.qcow2 \
            -a ${{ matrix.arch.name }} \
            -c ${{ matrix.conf.id }}
