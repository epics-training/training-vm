name: "Resolve Stage-1 Build Run"

on:
  workflow_call:
    inputs:
      workflow_file:
        required: true
        type: string
      sha:
        required: true
        type: string
      branch:
        description: "Branch to check for a same-branch fallback build (e.g. the branch/PR under test)"
        required: true
        type: string
    outputs:
      run_id:
        description: "Run ID of the stage-1 build whose qcow2 artifacts should be used"
        value: ${{ jobs.resolve.outputs.run_id }}
      source:
        description: "same-commit | same-branch | main-fallback"
        value: ${{ jobs.resolve.outputs.source }}

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      source: ${{ steps.resolve.outputs.source }}
    steps:
      - name: Resolve build run
        id: resolve
        env:
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          TARGET_SHA: ${{ inputs.sha }}
          TARGET_BRANCH: ${{ inputs.branch }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const workflow_file = process.env.WORKFLOW_FILE;
            const sha = process.env.TARGET_SHA;
            const branch = process.env.TARGET_BRANCH;
            const max_retries = 6;
            const retry_delay_ms = 30000;

            let retry_count = 0;
            while (true) {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow_file,
                head_sha: sha,
              });
              const run = runs.workflow_runs.find(r => r.head_sha === sha);

              if (!run) {
                if (retry_count < max_retries) {
                  console.log(`No run of ${workflow_file} found for ${sha} yet. Retry ${retry_count + 1}/${max_retries}...`);
                  retry_count++;
                  await new Promise(r => setTimeout(r, retry_delay_ms));
                  continue;
                }
                console.log(`No run of ${workflow_file} found for ${sha} after ${max_retries} retries. Falling back to branch history.`);
                break;
              }

              if (run.status !== "completed") {
                console.log(`Run ${run.id} is still ${run.status}. Waiting...`);
                await new Promise(r => setTimeout(r, retry_delay_ms));
                continue;
              }

              console.log(`Found run ${run.id} for ${sha}, conclusion=${run.conclusion}`);
              if (run.conclusion === "success") {
                core.setOutput("run_id", run.id.toString());
                core.setOutput("source", "same-commit");
                return;
              }
              console.log(`Stage-1 build (${workflow_file}) for commit ${sha} concluded with '${run.conclusion}', not 'success'. Falling back to branch history instead of failing outright.`);
              break;
            }

            // Tier 2: latest successful run on the same branch as the commit under test.
            const { data: branchRuns } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow_file,
              branch: branch,
              status: "success",
              per_page: 1,
            });

            if (branchRuns.workflow_runs.length > 0) {
              const fallback = branchRuns.workflow_runs[0];
              console.log(`Using same-branch (${branch}) fallback run ${fallback.id} (created ${fallback.created_at}).`);
              core.setOutput("run_id", fallback.id.toString());
              core.setOutput("source", "same-branch");
              return;
            }

            console.log(`No successful run of ${workflow_file} on branch ${branch}. Falling back to main.`);

            // Tier 3: latest successful run on main (skip if branch under test already is main).
            if (branch !== "main") {
              const { data: mainRuns } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow_file,
                branch: "main",
                status: "success",
                per_page: 1,
              });

              if (mainRuns.workflow_runs.length > 0) {
                const fallback = mainRuns.workflow_runs[0];
                console.log(`Using main-branch fallback run ${fallback.id} (created ${fallback.created_at}).`);
                core.setOutput("run_id", fallback.id.toString());
                core.setOutput("source", "main-fallback");
                return;
              }
            }

            core.setFailed(`No successful run of ${workflow_file} found for commit ${sha}, on branch ${branch}, or on main. There is no qcow2 image available to test against.`);
