---
# Build ChannelFinder from its source release and run it as a service

- name: Download ChannelFinder {{ channelfinder_version }}
  become: true
  ansible.builtin.get_url:
    url: "{{ channelfinder_download_url }}"
    dest: "/tmp/channelfinder-{{ channelfinder_version }}.tar.gz"
    mode: "0644"
  register: channelfinder_download
  retries: 3
  delay: 10
  until: channelfinder_download is succeeded

- name: Find older ChannelFinder source trees
  ansible.builtin.find:
    paths: "{{ channelfinder_src_dir | dirname }}"
    patterns: "channelfinder-*"
    file_type: directory
    excludes: "{{ channelfinder_src_dir | basename }}"
  register: channelfinder_old_sources

- name: Remove older ChannelFinder source trees
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ channelfinder_old_sources.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Ensure ChannelFinder source directory exists
  become: true
  ansible.builtin.file:
    path: "{{ channelfinder_src_dir }}"
    state: directory
    mode: "0755"

- name: Unpack ChannelFinder {{ channelfinder_version }}
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/channelfinder-{{ channelfinder_version }}.tar.gz"
    dest: "{{ channelfinder_src_dir }}"
    remote_src: true
    owner: root
    group: root
    extra_opts:
      - --strip-components=1
    creates: "{{ channelfinder_src_dir }}/pom.xml"

# Not a git checkout: skip the git-commit-id plugin and use a fixed
# build timestamp instead of the commit time. fmt.skip: don't reformat.
- name: Build ChannelFinder (this may take a while)
  become: true
  ansible.builtin.command: >-
    mvn --batch-mode clean package -DskipTests=true -Dfmt.skip=true
    -Dmaven.gitcommitid.skip=true -Dproject.build.outputTimestamp=1
  args:
    chdir: "{{ channelfinder_src_dir }}"
    creates: "{{ channelfinder_src_dir }}/target/ChannelFinder-{{ channelfinder_version }}.jar"
  environment:
    JAVA_HOME: "{{ java_home }}"
    MVN_HOME: "{{ mvn_home }}"
    PATH: "{{ java_home }}/bin:{{ mvn_home }}/bin:{{ ansible_env.PATH }}"

- name: Ensure channelfinder group exists
  become: true
  ansible.builtin.group:
    name: "{{ channelfinder_account }}"
    system: true
    state: present

- name: Ensure channelfinder user exists
  become: true
  ansible.builtin.user:
    name: "{{ channelfinder_account }}"
    group: "{{ channelfinder_account }}"
    system: true
    home: "{{ channelfinder_root }}"
    createhome: false
    shell: /sbin/nologin
    state: present

- name: Ensure ChannelFinder service directory exists
  become: true
  ansible.builtin.file:
    path: "{{ channelfinder_root }}"
    state: directory
    owner: "{{ channelfinder_account }}"
    group: "{{ channelfinder_account }}"
    mode: "0755"

- name: Find older ChannelFinder jars
  ansible.builtin.find:
    paths: "{{ channelfinder_root }}"
    patterns: "ChannelFinder-*.jar"
    excludes: "{{ channelfinder_jar | basename }}"
  register: channelfinder_old_jars

- name: Remove older ChannelFinder jars
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ channelfinder_old_jars.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Install the ChannelFinder service jar
  become: true
  ansible.builtin.copy:
    src: "{{ channelfinder_src_dir }}/target/ChannelFinder-{{ channelfinder_version }}.jar"
    dest: "{{ channelfinder_jar }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart channelfinder

# Contains passwords
- name: Create ChannelFinder configuration
  become: true
  ansible.builtin.template:
    src: application.properties.j2
    dest: "{{ channelfinder_root }}/application.properties"
    owner: root
    group: "{{ channelfinder_account }}"
    mode: "0640"
  notify: Restart channelfinder

- name: Create ChannelFinder systemd service
  become: true
  ansible.builtin.template:
    src: channelfinder.service.j2
    dest: /etc/systemd/system/channelfinder.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart channelfinder

- name: Manage ChannelFinder service
  become: true
  when: not in_container
  ansible.builtin.systemd_service:
    name: channelfinder
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending ChannelFinder restarts before verifying
  ansible.builtin.meta: flush_handlers

- name: Verify that ChannelFinder is running
  when: not in_container
  block:
    # The service info is JSON, but served as text/plain
    - name: Wait for the ChannelFinder REST API to report Elasticsearch connected
      ansible.builtin.uri:
        url: "{{ channelfinder_url }}"
        return_content: true
      register: channelfinder_info
      until: >-
        channelfinder_info.status == 200 and
        ((channelfinder_info.content | from_json).elastic | default({})).status
        | default('') == 'Connected'
      retries: 36
      delay: 5

  rescue:
    - name: Collect ChannelFinder diagnostics
      become: true
      ansible.builtin.shell:
        cmd: |
          set +e
          systemctl status channelfinder --no-pager --lines=0
          echo "--- journal"
          journalctl -u channelfinder --no-pager -n 80
      register: channelfinder_diagnostics
      changed_when: false
      failed_when: false

    - name: Show ChannelFinder diagnostics
      ansible.builtin.debug:
        var: channelfinder_diagnostics.stdout_lines

    - name: Fail because ChannelFinder is not running
      ansible.builtin.fail:
        msg: >-
          ChannelFinder did not come up - see the diagnostics above
          and 'journalctl -u channelfinder'

- name: Add ChannelFinder link to the Training-VM homepage
  when: not in_container and install_graphics | default(false) | bool
  become: true
  ansible.builtin.copy:
    content: |
      <li><a href="{{ channelfinder_url | regex_replace('/[^/]*/?$', '') }}/index.html">ChannelFinder</a></li>
    dest: "{{ training_vm_homepage_dir }}/links.d/55-channelfinder"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
  notify: Reassemble Training-VM homepage
