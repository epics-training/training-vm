---
# Contributes a link to the shared Training-VM homepage set up by
# initial_setup (see roles/initial_setup/tasks/homepage.yml)
- name: Add Olog web client link to the Training-VM homepage
  become: true
  ansible.builtin.copy:
    content: |
      <li><a href="{{ olog_webclient_homepage_link_url }}">{{ olog_webclient_homepage_link_title }}</a></li>
    dest: "{{ training_vm_homepage_dir }}/links.d/40-olog"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
  notify: Reassemble Training-VM homepage
