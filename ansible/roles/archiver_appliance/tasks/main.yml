---
# Download and install the archiver appliance
- name: Install and configure MariaDB
  ansible.builtin.include_tasks:
    file: install_mariadb.yml

- name: Check if the requested Tomcat/Archiver Appliance versions are installed
  become: true
  ansible.builtin.stat:
    path: "{{ archiver_appliance_version_flag }}"
  register: archiver_appliance_installation
  changed_when: false

- name: Remove outdated Tomcat/Archiver Appliance installation
  ansible.builtin.include_tasks:
    file: remove_installation.yml
  when: not archiver_appliance_installation.stat.exists

- name: Download and install Tomcat
  ansible.builtin.include_tasks:
    file: install_tomcat.yml
  when: not archiver_appliance_installation.stat.exists

- name: Download and install the Archiver Appliance
  ansible.builtin.include_tasks:
    file: install_appliance.yml
  when: not archiver_appliance_installation.stat.exists

- name: Mark the installed Tomcat/Archiver Appliance versions
  become: true
  ansible.builtin.copy:
    content: ""
    dest: "{{ archiver_appliance_version_flag }}"
    mode: "0644"
  when: not archiver_appliance_installation.stat.exists

- name: Ensure storage and configuration directories exist
  become: true
  ansible.builtin.file:
    path: "{{ tomcat_home }}/{{ item }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
  loop:
    - storage/sts
    - storage/mts
    - storage/lts
    - archappl_conf

- name: Configure Archiver Appliance
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ tomcat_home }}/archappl_conf/{{ item }}"
  loop:
    - appliances.xml
    - policies.py

- name: Set the archappl.properties
  become: true
  ansible.builtin.template:
    src: archappl.properties.j2
    dest: "{{ tomcat_home }}/webapps/archappl.properties"
    owner: root
    group: "{{ tomcat_group }}"
    mode: "0640"
  notify:
    - Restart archiver-appliance

- name: Create Tomcat setenv.sh script
  become: true
  ansible.builtin.template:
    src: setenv.sh.j2
    dest: "{{ tomcat_home }}/bin/setenv.sh"
    owner: root
    group: "{{ tomcat_group }}"
    mode: "0644"
  notify:
    - Restart archiver-appliance

- name: Check if we have set up the archiver tables
  community.mysql.mysql_query:
    login_db: archappl
    login_user: archappl
    login_password: archappl
    query: show tables
  register: tables

# become: the SQL script lives below webapps/, which is only readable by tomcat
- name: Run the Archiver-Appliance's MariaDB install script
  become: true
  ansible.builtin.shell:
    cmd: "mariadb -u archappl --password=archappl archappl < {{ tomcat_home }}/webapps/mgmt/install/archappl_mysql.sql"
  when: tables.rowcount[0] == 0

- name: Check that the archiver tables exist
  community.mysql.mysql_query:
    login_db: archappl
    login_user: archappl
    login_password: archappl
    query: show tables
  register: tables
  failed_when: tables.rowcount[0] == 0

- name: Create Archiver Appliance systemd service
  become: true
  ansible.builtin.template:
    src: archiver_appliance.service.j2
    dest: /etc/systemd/system/archiver-appliance.service
    owner: root
    group: root
    mode: "0644"

- name: Manage Archiver Appliance service
  become: true
  when: not in_container
  ansible.builtin.systemd_service:
    name: archiver-appliance
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending Archiver Appliance restarts before checking it
  ansible.builtin.meta: flush_handlers

- name: Check that the Archiver Appliance is up and answering
  when: not in_container
  ansible.builtin.uri:
    url: "http://localhost:17665/mgmt/bpl/getApplianceInfo\
      ?id={{ archiver_appliance_id }}"
    return_content: true
  register: archiver_appliance_info
  until: >-
    archiver_appliance_info.status == 200 and
    (archiver_appliance_info.json | default({})).identity | default('')
    == archiver_appliance_id
  retries: 36
  delay: 5

- name: Add Archiver Appliance link to the Training-VM homepage
  when: not in_container and install_graphics | bool
  ansible.builtin.include_tasks:
    file: add_homepage_link.yml
