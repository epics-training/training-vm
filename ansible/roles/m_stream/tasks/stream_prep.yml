---
- name: "{{ module.name }} pre-build hook | Ensure configure directory exists"
  ansible.builtin.file:
    path: "{{ epics_install_path }}/{{ module.id }}-{{ module.version }}/configure"
    state: directory
    mode: '0755'
  become: true

- name: "{{ module.name }} pre-build hook | Add CONFIG_SITE.local"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/m_stream/templates/CONFIG_SITE.local.j2"
    dest: "{{ epics_install_path }}/{{ module.id }}-{{ module.version }}/configure/CONFIG_SITE.local"
  become: true

# Cherry-pick of upstream StreamDevice commit e87e093c846ca19383462036d2f85ca5369b17b3
# Recent ASYN makes vxi11 support conditional, so streamApp's old asynRegistrars.dbd fails to link
- name: "{{ module.name }} pre-build hook | Make vxi11 support optional (StreamDevice#e87e093)"
  ansible.builtin.replace:
    path: "{{ epics_install_path }}/{{ module.id }}-{{ module.version }}/streamApp/Makefile"
    regexp: |-
      ifdef ASYN
      # edit asynRegistrars\.dbd if necessary
      streamApp_DBD \+= asynRegistrars\.dbd
      # add asynRecord\.dbd if you like
      streamApp_DBD \+= asynRecord\.dbd
      PROD_LIBS \+= asyn
    replace: |-
      ifdef ASYN
      streamApp_DBD += asyn.dbd
      streamApp_DBD += drvAsynIPPort.dbd
      streamApp_DBD += drvAsynSerialPort.dbd
      # vxi11 support is optional in recent asyn versions
      #streamApp_DBD += drvVxi11.dbd

      PROD_LIBS += asyn
  become: true

- name: "{{ module.name }} pre-build hook | Remove obsolete asynRegistrars.dbd"
  ansible.builtin.file:
    path: "{{ epics_install_path }}/{{ module.id }}-{{ module.version }}/streamApp/asynRegistrars.dbd"
    state: absent
  become: true

- name: "{{ module.name }} pre-build hook | Download PCRE sources"
  ansible.builtin.unarchive:
    src: "https://sourceforge.net/projects/pcre/files/pcre/8.45/pcre-8.45.tar.bz2/download"
    dest: "{{ epics_install_path }}/{{ module.id }}-{{ module.version }}/"
    owner: root
    group: root
    remote_src: true
    extra_opts:
      - --transform
      - "s|^[^/]*|pcre|" # normalize source path
  become: true
  register: pcre_download_result
  until: pcre_download_result is success
  retries: 3
  delay: 5

- name: "{{ module.name }} pre-build hook | Configure PCRE"
  ansible.builtin.command:
    cmd: ./configure
    chdir: "{{ epics_install_path }}/{{ module.id }}-{{ module.version }}/pcre"
  become: true

- name: "{{ module.name }} pre-build hook | Build PCRE (this may take a while)"
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ epics_install_path }}/{{ module.id }}-{{ module.version }}/pcre"
  become: true
