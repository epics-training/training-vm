---
- name: "{{ module.name }} pre-build hook | Fix configure/RELEASE"
  ansible.builtin.lineinfile:
    path: "{{ epics_install_path }}/{{ module.id }}-{{ module.version }}/configure/RELEASE"
    regexp: '^SNCSEQ='
    state: absent
  become: true

# sscan-2.11.6's scanparmRecord.c declares "monitor" the old K&R way (i.e.
# "unspecified arguments") and then calls it with an argument. That was legal
# pre-C23, but C23 redefined empty parens to mean "takes no arguments" (like
# C++), so GCC 15's C23-by-default (Fedora 44, Ubuntu 26.04) now makes this a
# hard type error, not a warning - same root cause as the busy/seq fixes (see
# m_areadetector/tasks/busy_prep.yml, m_seq/tasks/seq_prep.yml).
- name: "{{ module.name }} pre-build hook | Allow legacy K&R-style declarations"
  ansible.builtin.blockinfile:
    path: "{{ epics_install_path }}/{{ module.id }}-{{ module.version }}/configure/CONFIG_SITE"
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    block: |
      USR_CFLAGS_Linux += -std=gnu17
  become: true
