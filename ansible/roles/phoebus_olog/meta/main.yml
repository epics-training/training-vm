---
# galaxy_info is required by Molecule's prerun (role name check)
galaxy_info:
  role_name: phoebus_olog
  namespace: epics
  author: Ralph Lange
  description: Olog (electronic logbook) service
  license: EPICS open license
  min_ansible_version: "2.15"
# Dependencies for Olog: log entries go to Elasticsearch, attachments to
# MongoDB (Maven for the build comes from the phoebus role's install_maven.yml)
dependencies:
  - role: java
  - role: elasticsearch
  - role: mongodb
