---
# Run the Phoebus alarm server (built by the phoebus role) as a service

- name: Check that the alarm server has been built
  ansible.builtin.find:
    paths: "{{ alarm_server_target_dir }}"
    patterns: "service-alarm-server-*.jar"
  register: alarm_server_jars

- name: Fail if the alarm server jar is missing
  ansible.builtin.fail:
    msg: >-
      No service-alarm-server-*.jar found in {{ alarm_server_target_dir }}.
      The alarm server is built by the phoebus role - make sure it ran successfully.
  when: alarm_server_jars.matched == 0

- name: Ensure alarm-server group exists
  become: true
  ansible.builtin.group:
    name: "{{ alarm_server_group }}"
    system: true
    state: present

# Needs a home directory: Phoebus keeps user settings/state under ~/.phoebus
- name: Ensure alarm-server user exists
  become: true
  ansible.builtin.user:
    name: "{{ alarm_server_user }}"
    group: "{{ alarm_server_group }}"
    system: true
    home: "{{ alarm_server_home }}"
    createhome: true
    shell: /sbin/nologin
    state: present

- name: Create alarm-server wrapper
  become: true
  ansible.builtin.template:
    src: alarm-server.sh.j2
    dest: /usr/local/bin/alarm-server
    owner: root
    group: root
    mode: "0755"
  notify: Restart alarm-server

- name: Create alarm-server systemd service
  become: true
  ansible.builtin.template:
    src: alarm-server.service.j2
    dest: /etc/systemd/system/alarm-server.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart alarm-server

- name: Manage alarm-server service
  become: true
  when: not in_container
  ansible.builtin.systemd_service:
    name: alarm-server
    state: started
    enabled: true
    daemon_reload: true

# --- Verify that the alarm system is actually up and running ---

- name: Apply pending service restarts before verifying
  ansible.builtin.meta: flush_handlers

- name: Verify that the alarm system is running
  when: not in_container
  block:
    - name: Wait for Kafka to accept connections
      ansible.builtin.wait_for:
        host: "{{ kafka_listen_host }}"
        port: "{{ kafka_port }}"
        timeout: 120

    # The alarm server creates its topics at startup (-create_topics)
    - name: Wait for the alarm server to create the {{ alarm_config_name }} topic
      ansible.builtin.command:
        cmd: "{{ kafka_home }}/bin/kafka-topics.sh --bootstrap-server {{ alarm_kafka_server }} --list"
      environment:
        JAVA_HOME: "{{ java_home }}"
      register: alarm_kafka_topics
      until: alarm_config_name in alarm_kafka_topics.stdout_lines
      retries: 24
      delay: 5
      changed_when: false

    # Give a crashing alarm server time to fail before checking
    - name: Let the services settle
      ansible.builtin.pause:
        seconds: 15

    - name: Get Kafka and alarm-server service state
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop:
        - kafka
        - alarm-server
      register: alarm_services

    - name: Check that Kafka and alarm-server are active
      ansible.builtin.assert:
        that:
          - item.status.ActiveState == 'active'
          - item.status.SubState == 'running'
        fail_msg: >-
          Service {{ item.item }} is {{ item.status.ActiveState }}/{{ item.status.SubState }}
          - see 'journalctl -u {{ item.item }}'
        success_msg: "Service {{ item.item }} is running"
        quiet: true
      loop: "{{ alarm_services.results }}"
      loop_control:
        label: "{{ item.item }}"
