# defaults for phoebus
---
phoebus_version: v6.0.0
# Override JavaFX version to build Phoebus with
# 21.0.11 has linux-aarch64 jars on Maven Central.
phoebus_openjfx_version: "21.0.11"

phoebus_launcher: "/opt/epics-tools/lib/phoebus/phoebus-product/phoebus.sh"
phoebus_owner: "root"
force_gpu: false

# JAVA options
phoebus_java_initial_heapsize: "256M"
phoebus_java_max_heapsize: "1024M"
phoebus_java_heap_tuning_opts: "-XX:MaxHeapFreeRatio=10 -XX:MinHeapFreeRatio=5 -XX:-ShrinkHeapInSteps"

epics_services_account: root

# Alarm system the client connects to (preferences.ini). The phoebus_alarm
# and phoebus_alarm_logger roles use the same variable names for the server
# side, so setting one of them in a setup file (e.g. vars/local.yml)
# configures client and services consistently.
# The alarm configuration name is also the name of its Kafka topic.
alarm_config_name: "Accelerator"
# Same as the phoebus_alarm default, so that a kafka_listen_host / kafka_port
# set in a setup file also reaches the client (the kafka role's defaults
# aren't visible here, hence the fallbacks matching them)
alarm_kafka_server: >-
  {{ kafka_listen_host | default('localhost') }}:{{ kafka_port | default(9092) }}
# REST API of the alarm logger (port 9000 is the Phoebus client default)
alarm_logger_url: "http://localhost:9000"

# ChannelFinder REST API (shared with the channelfinder role)
channelfinder_url: "http://localhost:8080/ChannelFinder"

# Documentation build: virtualenv location, and the distro's Python package
# to use where the system python3 is older than 3.11 (Rocky 9, Ubuntu 22.04)
phoebus_docs_src: "/opt/epics-tools/lib/phoebus/docs"
phoebus_docs_venv: "/opt/epics-tools/lib/phoebus-docs-venv"
phoebus_docs_python_fallback: >-
  {{ 'python3.12' if is_redhat else 'python3.11' }}

# Archiver Appliance retrieval service used by the Data Browser
# (only configured when the archiver_appliance role is enabled)
archiver_host: localhost
archiver_retrieval_port: 17665
