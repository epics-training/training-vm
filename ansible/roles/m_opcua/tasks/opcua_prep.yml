---
- name: "{{ module.name }} pre-build hook | Prepare extras installation dir"
  file:
    path: "/opt/opcua"
    state: directory
    mode: '0755'
  become: true

- name: "{{ module.name }} pre-build hook | Download the open62541 client SDK"
  get_url:
    url: "https://github.com/open62541/open62541/archive/refs/tags/v1.3.15.tar.gz"
    dest: "/tmp/open62541-1.3.15.tar.gz"

- name: "{{ module.name }} pre-build hook | Extract open62541 client SDK"
  unarchive:
    src: "/tmp/open62541-1.3.15.tar.gz"
    dest: "/opt/opcua"
    owner: root
    group: root
    remote_src: true
    extra_opts:
      - --transform
      - "s|^[^/]*|open62541|" # normalize source path
  become: true

- name: "{{ module.name }} pre-build hook | Prepare open62541 build dir"
  file:
    path: "/opt/opcua/open62541/build"
    state: directory
    mode: '0755'
  become: true

# open62541 defaults UA_FORCE_WERROR to ON.
# Its openssl crypto plugin trips GCC's -Wjump-misses-init
# (a goto jumping over a variable's scope) on newer GCC (e.g. Fedora 44);
# harmless, so disable the blanket -Werror rather than chase individual warnings.
- name: "{{ module.name }} pre-build hook | Build open62541 (cmake)"
  ansible.builtin.command:
    chdir: "/opt/opcua/open62541/build"
    cmd: cmake .. -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUA_ENABLE_ENCRYPTION=OPENSSL -DUA_FORCE_WERROR=OFF
  become: true

- name: "{{ module.name }} pre-build hook | Build open62541 (make)"
  ansible.builtin.command:
    cmd: make {{ module.args | default('') }} install
    chdir: "/opt/opcua/open62541/build"
  become: true

- name: "{{ module.name }} pre-build hook | Install xca from sources (rocky)"
  ansible.builtin.include_tasks: install_xca.yml
  when: ansible_facts['distribution'] == 'Rocky'

- name: "{{ module.name }} pre-build hook | Install xca package (fedora)"
  ansible.builtin.dnf:
    name: xca
    install_weak_deps: false
    state: present
  become: true
  when: ansible_facts['distribution'] == 'Fedora'

- name: "{{ module.name }} pre-build hook | Download the demo server"
  get_url:
    url: "https://github.com/epics-training/opcua-support/releases/download/v1.0/server_demo.tar.gz"
    dest: "/opt/opcua/server_demo.tar.gz"
  become: true

# UaExpert is a closed-source binary from Unified Automation and is only
# published for x86_64 Linux, so there is nothing to fetch on other
# architectures. The opcua module itself builds fine without it - only the
# interactive OPC UA browsing exercise is unavailable.
- name: "{{ module.name }} pre-build hook | Download the UaExpert client (x86_64 only)"
  get_url:
    url: "https://github.com/epics-training/opcua-support/releases/download/v1.0/ua_expert.AppImage"
    dest: "/opt/opcua/uaexpert.AppImage"
    mode: "555"
  become: true
  when: is_x86_64

# Cherry-pick of upstream commit 485922c1e9b5bcce34d87be7bc5a6545209f8986
# ("fix gcc-15 problem"), not yet in the v0.11.2 tag.
- name: "{{ module.name }} pre-build hook | Fix extern \"C\" export nested in namespace (gcc-15, iocshIntegration.cpp)"
  ansible.builtin.replace:
    path: "{{ epics_install_path }}/{{ module.id }}-{{ module.version }}/devOpcuaSup/iocshIntegration.cpp"
    regexp: |-
      extern "C" \{
      epicsExportRegistrar\(opcuaIocshRegister\);
      \}

      \} // namespace
    replace: |-
      } // namespace

      extern "C" { epicsExportRegistrar(opcuaIocshRegister); }
  become: true

- name: "{{ module.name }} pre-build hook | Fix extern \"C\" export nested in namespace (gcc-15, opcuaItemRecord.cpp)"
  ansible.builtin.replace:
    path: "{{ epics_install_path }}/{{ module.id }}-{{ module.version }}/devOpcuaSup/opcuaItemRecord.cpp"
    regexp: |-
      extern "C" \{ epicsExportAddress\(rset, opcuaItemRSET\); \}

      \} // namespace
    replace: |-
      } // namespace

      extern "C" { epicsExportAddress(rset, opcuaItemRSET); }
  become: true

- name: "{{ module.name }} pre-build hook| Ensure configure directory exists"
  ansible.builtin.file:
    path: "{{ epics_install_path }}/{{ module.id }}-{{ module.version }}/configure"
    state: directory
    mode: '0755'
  become: true

- name: "{{ module.name }} pre-build hook | CONFIG_SITE.local"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/m_opcua/templates/opcua_CONFIG_SITE.local.j2"
    dest: "{{ epics_install_path }}/{{ module.id }}-{{ module.version }}/configure/CONFIG_SITE.local"
  become: true
