# Install Java
---
- name: Ensure java_home directory exists
  become: true
  file:
    path: "{{ java_home }}"
    state: directory

- name: Install open jdk {{ java_major }}
  become: true
  ansible.builtin.unarchive:
    src: "{{ java_url }}"
    dest: "{{ java_home }}"
    remote_src: true
    creates: "{{ java_home }}/bin/java"
    extra_opts:
      - --strip-components=1

- name: Check that the new JDK is working
  ansible.builtin.command: "{{ java_home }}/bin/java -version"
  register: java_version_check
  changed_when: false
  failed_when: false

- name: Remove older JDK installations
  become: true
  ansible.builtin.file:
    path: "{{ java_home | dirname }}/{{ item }}"
    state: absent
  loop:
    - jdk-17
    - jdk-21
  when:
    - java_version_check.rc == 0
    - (java_home | dirname) + '/' + item != java_home

- name: Check if CA certificate (DER format) exists
  ansible.builtin.stat:
    path: "{{ ca_trust_der_path }}"
  register: ca_cert_der
  changed_when: false
  when: ca_trust_der_path is defined

- name: Add CA certificate to java trust store
  community.general.java_cert:
    cert_path: "{{ ca_trust_der_path }}"
    keystore_path: "{{ java_home }}/lib/security/cacerts"
    keystore_pass: changeit
    state: present
    cert_alias: Training_VM_RootCA
    trust_cacert: true
  become: true
  environment:
    PATH: "{{ java_home }}/bin:{{ ansible_env.PATH }}"
  when: ca_trust_der_path is defined and ca_cert_der.stat.exists
